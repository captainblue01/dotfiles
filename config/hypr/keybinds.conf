source = $HOME/.config/hypr/apps.conf
###################
### KEYBINDINGS ###
###################
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# See https://wiki.hyprland.org/Configuring/Keywords/


$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod SHIFT, N, focusworkspaceoncurrentmonitor, 14
bind = $mainMod, N, movetoworkspacesilent, 14

##################
### APP LAUNCH ###
##################
bind = $mainMod, Return, togglespecialworkspace, terminal
bind = $mainMod, D, exec, $menu # App Menu
bind = $mainMod, V, exec, $HOME/.config/fuzzel/cliphist # Clipboard History

## APP LAUNCH MODE
bind = $mainMod, X, submap, App Launch Mode
submap = App Launch Mode

bind = , W, exec, $webBrowser
bind = , W, submap, reset

bind = , F, togglespecialworkspace, file_manager
bind = , F, submap, reset

bind = , E, exec, $email
bind = , E, submap, reset

bind = , Return, exec, $terminal -e $HOME/.config/tmux/scripts/tmux-browser
bind = , Return, submap, reset

bind = , S, exec, $screenshotSoftware
bind = , S, submap, reset

bind = , B, togglespecialworkspace, bluetooth
bind = , B, submap, reset

bind = , V, togglespecialworkspace, audio_mixer
bind = , V, submap, reset

bind = , N, togglespecialworkspace, notes
bind = , N, submap, reset

bind = , C, togglespecialworkspace, calculator
bind = , C, submap, reset

bind = , M, togglespecialworkspace, music_player
bind = , M, submap, reset

bind = , P, togglespecialworkspace, password_manager
bind = , P, submap, reset

bind = , escape, submap, reset
submap = reset


######################
### Window Control ###
######################
bind = $mainMod, R, submap, Window Control Mode
submap = Window Control Mode

binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

bind = , escape, submap, reset
submap = reset


##############
### System ###
##############
bind = $mainMod CTRL, C, killactive,
bind = $mainMod CTRL, Q, exit,
bind = $mainMod CTRL, R, exec, $HOME/.config/hypr/scripts/wallpaper-reload.sh
bind = $mainMod, F, togglefloating,

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, M, fullscreen, 1 
bind = $mainMod, Space, cyclenext
bind = $mainMod, B, exec, $HOME/.config/hypr/scripts/rename-workspace.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10
bind = $mainMod, Q, focusworkspaceoncurrentmonitor, 11
bind = $mainMod, W, focusworkspaceoncurrentmonitor, 12
bind = $mainMod, E, focusworkspaceoncurrentmonitor, 13

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT, Q, movetoworkspacesilent, 11
bind = $mainMod SHIFT, W, movetoworkspacesilent, 12
bind = $mainMod SHIFT, E, movetoworkspacesilent, 13

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

