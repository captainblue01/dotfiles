# ~/.config/hypr/hyprpaper.conf

ipc = true
splash = false

wallpaper {
  monitor = 
  order = random
  path = ~/.config/desktopwallpapers
  fit_mode = cover
  timeout = 900
}

wallpaper {
  monitor = eDP-1
  order = random
  path = ~/.config/desktopwallpapers
  fit_mode = cover
  timeout = 900
}
wallpaper {
  monitor = DP-10
  order = random
  path = ~/.config/desktopwallpapers
  fit_mode = cover
  timeout = 900
}

wallpaper {
  monitor = DP-2
  order = random
  path = ~/.config/desktopwallpapers
  fit_mode = cover
  timeout = 900
}
wallpaper {
  monitor = HDMI-A-2
  order = random
  path = ~/.config/desktopwallpapers
  fit_mode = cover
  timeout = 900
}
